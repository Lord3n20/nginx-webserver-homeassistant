user                            root;
worker_processes                auto;

error_log                       /var/log/nginx/error.log warn;

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    off;
    access_log                  off;
    keepalive_timeout           3000;
    server {
        listen                  3000;            # use Port 3000 instead of the default
        root                    /media/website/; # use another folder for root, this folder is mounted into the docker, this way we can change the contents of the website without rebuilding the whole app
        index                   index.html;
        server_name             localhost;
        absolute_redirect       off;
    }
}
